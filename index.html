<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Treasure Jewels BD</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff8e7, #f5e6c8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: #fff;
            background: #111;
            padding: 15px;
            margin: 13px 0;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            transform: scale(1.03);
            background: #333;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Your Logo -->
    <img src="logo.png" class="logo" alt="Treasure Jewels BD">

    <h1>Treasure Jewels BD</h1>

    <p class="description">
        Discover beautiful jewellery & accessories ✨
    </p>

    <a class="button"
       href="https://www.facebook.com/treasurejewelsbd"
       target="_blank">
        🔵 Facebook
    </a>

    <a class="button"
       href="https://www.instagram.com/treasure_jewels_bd/"
       target="_blank">
        🟣 Instagram
    </a>

    <a class="button"
       href="https://www.tiktok.com/@treasure_jewels_bd"
       target="_blank">
        ⚫ TikTok
    </a>

    <a class="button"
       href="https://wa.me/880134084472"
       target="_blank">
        🟢 WhatsApp
    </a>

    <div class="footer">
        © 2026 Treasure Jewels BD
    </div>

</div>

</body>
</html>
