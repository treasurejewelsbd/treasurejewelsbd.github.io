<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Treasure Jewels BD</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at top, #3b2a0f 0%, #111 35%, #050505 100%);
    color: white;
    display: flex;
    justify-content: center;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 430px;
    text-align: center;
}

/* Logo */

.logo {
    width: 120px;
    height: 120px;
    object-fit: contain;
    border-radius: 50%;
    margin: 10px auto 18px;
    display: block;
    filter: drop-shadow(0 0 20px rgba(212,175,55,0.45));
}

/* Brand */

.brand {
    font-size: 28px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #d4af37;
}

.tagline {
    margin-top: 8px;
    color: #ddd;
    font-size: 14px;
    letter-spacing: 1px;
}

/* Divider */

.divider {
    width: 70px;
    height: 2px;
    background: #d4af37;
    margin: 20px auto;
}

/* Main button */

.shop {
    display: block;
    text-decoration: none;
    color: #080808;
    background: linear-gradient(135deg, #f8e7a6, #d4af37, #f8e7a6);
    padding: 16px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 15px;
    box-shadow: 0 8px 25px rgba(212,175,55,0.25);
    transition: 0.3s;
}

.shop:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 12px 35px rgba(212,175,55,0.45);
}

/* Social buttons */

.button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    text-decoration: none;
    color: white;

    padding: 15px;
    margin: 12px 0;

    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 14px;

    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);

    font-size: 16px;
    font-weight: 600;

    transition: 0.3s;
}

.button:hover {
    transform: translateY(-3px);
    border-color: #d4af37;
    background: rgba(212,175,55,0.12);
    box-shadow: 0 8px 25px rgba(212,175,55,0.15);
}

.icon {
    font-size: 21px;
}

/* Collection */

.collection {
    margin-top: 28px;
    padding: 20px;

    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 18px;

    background: rgba(255,255,255,0.04);
}

.collection h2 {
    color: #d4af37;
    font-size: 20px;
    margin-bottom: 8px;
}

.collection p {
    color: #ccc;
    font-size: 14px;
    line-height: 1.6;
}

/* Footer */

.footer {
    margin-top: 30px;
    padding-bottom: 15px;

    color: #777;
    font-size: 12px;
}

.footer span {
    color: #d4af37;
}

/* Mobile */

@media (max-width: 400px) {

    .brand {
        font-size: 24px;
        letter-spacing: 2px;
    }

    .logo {
        width: 105px;
        height: 105px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <img src="logo.png" class="logo" alt="Treasure Jewels BD">

    <!-- BRAND -->
    <h1 class="brand">TREASURE JEWELS BD</h1>

    <p class="tagline">
        Elegance in Every Detail ✨
    </p>

    <div class="divider"></div>

    <!-- SHOP -->
    <a class="shop"
       href="https://www.facebook.com/treasurejewelsbd"
       target="_blank">
       🛍️ SHOP NOW
    </a>

    <!-- WHATSAPP -->
    <a class="button"
       href="https://wa.me/880134084472"
       target="_blank">

       <span class="icon">🟢</span>
       <span>Order on WhatsApp</span>

    </a>

    <!-- FACEBOOK -->
    <a class="button"
       href="https://www.facebook.com/treasurejewelsbd"
       target="_blank">

       <span class="icon">📘</span>
       <span>Facebook</span>

    </a>

    <!-- INSTAGRAM -->
    <a class="button"
       href="https://www.instagram.com/treasure_jewels_bd/"
       target="_blank">

       <span class="icon">📸</span>
       <span>Instagram</span>

    </a>

    <!-- TIKTOK -->
    <a class="button"
       href="https://www.tiktok.com/@treasure_jewels_bd"
       target="_blank">

       <span class="icon">🎵</span>
       <span>TikTok</span>

    </a>

    <!-- COLLECTION -->
    <div class="collection">

        <h2>✨ Discover Your Sparkle</h2>

        <p>
            Explore our beautiful jewellery collection
            and find something special for every occasion.
        </p>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 <span>Treasure Jewels BD</span>
        <br>
        Made with ✨ for jewellery lovers
    </div>

</div>

</body>
</html>
