<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Treasure Jewels BD</title>

    <meta name="description"
          content="Treasure Jewels BD - Elegant jewellery for every occasion.">

    <style>

        /* =========================
           BASIC RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(circle at top,
                #fff7df 0%,
                #f8ecd0 35%,
                #efe1bf 100%);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            color: #222;
        }


        /* =========================
           MAIN CARD
        ========================== */

        .container {
            width: 100%;
            max-width: 430px;

            text-align: center;

            background: rgba(255, 255, 255, 0.72);

            backdrop-filter: blur(12px);

            border-radius: 28px;

            padding: 35px 25px 25px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.8);
        }


        /* =========================
           LOGO
        ========================== */

        .logo {
            width: 105px;
            height: 105px;

            object-fit: contain;

            border-radius: 50%;

            background: white;

            padding: 7px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);

            margin-bottom: 18px;
        }


        /* =========================
           BRAND NAME
        ========================== */

        h1 {
            font-family: Georgia, serif;

            font-size: 29px;

            letter-spacing: 0.5px;

            margin-bottom: 8px;
        }


        .tagline {
            font-size: 14px;

            color: #777;

            margin-bottom: 28px;

            line-height: 1.5;
        }


        /* =========================
           SOCIAL BUTTONS
        ========================== */

        .button {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            width: 100%;

            padding: 15px;

            margin: 13px 0;

            border-radius: 14px;

            text-decoration: none;

            color: #222;

            background: #ffffff;

            border: 1px solid #eadfca;

            font-size: 16px;

            font-weight: 600;

            transition: all 0.25s ease;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.05);
        }


        .button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.12);

            background: #fffaf0;
        }


        .icon {
            font-size: 21px;
        }


        /* =========================
           WHATSAPP BUTTON
        ========================== */

        .whatsapp {
            background: #222;

            color: white;

            border: none;
        }

        .whatsapp:hover {
            background: #333;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {
            margin-top: 28px;

            font-size: 12px;

            color: #999;

            line-height: 1.5;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 30px 20px 22px;

                border-radius: 24px;
            }

            h1 {
                font-size: 26px;
            }

            .logo {
                width: 95px;
                height: 95px;
            }
        }

    </style>
</head>


<body>


    <div class="container">


        <!-- =========================
             YOUR LOGO
        ========================== -->

        <img
            src="logo.png"
            alt="Treasure Jewels BD Logo"
            class="logo"
        >


        <!-- =========================
             BRAND
        ========================== -->

        <h1>Treasure Jewels BD</h1>

        <p class="tagline">
            Elegant jewellery for every special moment ✨
        </p>


        <!-- =========================
             FACEBOOK
        ========================== -->

        <a
            href="https://www.facebook.com/treasurejewelsbd"
            target="_blank"
            class="button"
        >
            <span class="icon">🔵</span>
            Facebook
        </a>


        <!-- =========================
             INSTAGRAM
        ========================== -->

        <a
            href="https://www.instagram.com/treasure_jewels_bd/"
            target="_blank"
            class="button"
        >
            <span class="icon">📸</span>
            Instagram
        </a>


        <!-- =========================
             TIKTOK
        ========================== -->

        <a
            href="https://www.tiktok.com/@treasure_jewels_bd"
            target="_blank"
            class="button"
        >
            <span class="icon">🎵</span>
            TikTok
        </a>


        <!-- =========================
             WHATSAPP
        ========================== -->

        <a
            href="https://wa.me/880134084472"
            target="_blank"
            class="button whatsapp"
        >
            <span class="icon">💬</span>
            Order on WhatsApp
        </a>


        <!-- =========================
             FOOTER
        ========================== -->

        <div class="footer">
            © 2026 Treasure Jewels BD
            <br>
            All rights reserved.
        </div>


    </div>


</body>
</html>
